[build-system]
requires = ['setuptools>=61']
build-backend = 'setuptools.build_meta'

[project]
name = 'photonsfile'
version = '2026.7.14'
description = 'Read Photonscore LINCam .photons (D7) files'
readme = 'README.md'
requires-python = '>=3.10'
license = 'MIT'
license-files = ['LICENSE']
authors = [{ name = 'Alex Hunt' }]
keywords = ['Photonscore', 'LINCam', 'D7', 'photons', 'TCSPC', 'FLIM']
dependencies = ['numpy']

[project.optional-dependencies]
all = ['numba']
test = ['pytest', 'numba']

[project.urls]
Homepage = 'https://github.com/alex1075/photonsfile'
'D7 format' = 'https://github.com/photonscore/d7'

[tool.setuptools]
packages = ['photonsfile']
